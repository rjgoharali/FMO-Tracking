name: fmo-tracking
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fmo_tracking}
      POSTGRES_USER: ${POSTGRES_USER:-fmo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fmo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fmo_tracking}
    command: ["node", "dist/database/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-fmo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fmo_tracking}
      STORAGE_LOCAL_PATH: /app/uploads
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 6s
      retries: 3
    restart: unless-stopped
  admin-dashboard:
    profiles: ["admin"]
    build:
      context: .
      dockerfile: admin-dashboard/Dockerfile
      args:
        GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
        GOOGLE_MAPS_MAP_ID: ${GOOGLE_MAPS_MAP_ID:-}
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  uploads:
